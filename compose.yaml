name: zhiyu
services:
  db:
    image: postgres:17-alpine
    container_name: zhiyu-db
    environment:
      POSTGRES_DB: zhiyu
      POSTGRES_USER: zhiyu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - zhiyu_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiyu -d zhiyu"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  zhiyu_pgdata:
