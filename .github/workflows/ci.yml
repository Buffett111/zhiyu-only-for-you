name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 / PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      TZ: UTC
      # Public dummy credentials for this disposable CI database only.
      DATABASE_URL: postgresql://zhiyu_ci:ci_only_not_for_deployment@127.0.0.1:5432/zhiyu_ci
      TEST_DATABASE_URL: postgresql://zhiyu_ci:ci_only_not_for_deployment@127.0.0.1:5432/zhiyu_ci
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zhiyu_ci
          POSTGRES_PASSWORD: ci_only_not_for_deployment
          POSTGRES_DB: zhiyu_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U zhiyu_ci -d zhiyu_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build the production frontend
        run: npm run build

      - name: Run unit and PostgreSQL integration tests
        # Tests use fixtures and mocked upstream providers. Live source checks,
        # background sync, Cloudflare setup and deployment are separate tasks.
        run: npm test
