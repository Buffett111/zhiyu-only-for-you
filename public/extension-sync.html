<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知隅 · 連接 YouTube 擴充功能</title><style>body{font:16px/1.8 system-ui;background:#f5f6f0;color:#3c4d35;max-width:620px;margin:10vh auto;padding:28px}h1{font-size:30px}button,a{padding:10px 18px;border-radius:8px;border:1px solid #bbc8b0;color:#405437;background:white}button{cursor:pointer;background:#526549;color:white;font-size:16px}#status{white-space:pre-line}input{padding:10px;border:1px solid #bbc8b0;border-radius:6px;font-size:15px}label{display:block;margin:16px 0}[hidden]{display:none!important}</style></head><body><small>ONLY FOR YOU</small><h1>YouTube 紀錄，回到知隅。</h1><p id="status" role="status">等待擴充功能連接。請先在 Chrome 安裝知隅 YouTube Capture，再於擴充功能按下「授權並連接知隅」。</p><div id="connect" hidden><p>請確認這是你要保存私人 YouTube 紀錄的帳號。連接後會自動回補紀錄並同步新的觀看。</p><label>裝置名稱 <input id="label" value="我的 Chrome" maxlength="60"></label><button id="confirm">確認此帳號並開始自動同步</button></div><p><a href="/?module=media">回到影音分析 ↗</a></p></body></html>
